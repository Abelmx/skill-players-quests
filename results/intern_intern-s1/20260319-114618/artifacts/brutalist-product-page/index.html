<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brutalist Product Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background: #fff;
            color: #000;
            margin: 2rem;
        }
        .product-container {
            max-width: 600px;
            margin: 0 auto;
            border: 4px solid #000;
            padding: 2rem;
        }
        .product-title {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }
        .product-image {
            width: 100%;
            height: 300px;
            background: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            font-weight: bold;
        }
        .product-price {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #666;
        }
        .buy-button {
            background: #000;
            color: #fff;
            border: 2px solid #000;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .buy-button:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="product-container">
        <h1 class="product-title">BRUTALIST DESK LAMP</h1>
        <div class="product-image">PRODUCT IMAGE</div>
        <p class="product-price">$199.00</p>
        <button class="buy-button">ADD TO CART</button>
    </div>
</body>
</html>
