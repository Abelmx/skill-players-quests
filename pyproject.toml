[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-players-quests"
version = "0.1.0"
description = "Evaluation framework for LLM Agent Skills usage capabilities"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # --- 框架核心 ---
    "openai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "python-frontmatter>=1.1",
    "rich>=13.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# --- Skills 脚本依赖 ---
# 评测环境必须安装；每个包标注了对应的 skill 名称
skills = [
    "httpx>=0.27",           # image-gen
    "Pillow>=10.0",          # image-gen, qr-code
    "qrcode>=7.4",           # qr-code
    "reportlab>=4.0",        # pdf-report
    "playwright>=1.40",      # web-screenshot (安装后还需 playwright install chromium)
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# 一次性安装全部
all = [
    "skill-players-quests[skills,dev]",
]

[project.scripts]
spq = "spq.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
