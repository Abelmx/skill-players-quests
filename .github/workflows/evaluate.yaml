name: LLM Skills Evaluation

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider to evaluate (openai, anthropic, vllm)"
        required: true
        default: "openai"
        type: choice
        options:
          - openai
          - anthropic
          - vllm
      mode:
        description: "Skill activation mode"
        required: true
        default: "catalog"
        type: choice
        options:
          - catalog
          - full_inject
      tasks:
        description: "Comma-separated task IDs (leave empty for all)"
        required: false
        type: string

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: python:3.12-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            curl \
            dnsutils \
            whois \
            git \
            && rm -rf /var/lib/apt/lists/*

      - name: Install gh CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update && apt-get install -y gh

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install httpx Pillow playwright qrcode[pil]
          playwright install --with-deps chromium || true

      - name: Run evaluation
        env:
          SPQ_OPENAI_API_KEY: ${{ secrets.SPQ_OPENAI_API_KEY }}
          SPQ_ANTHROPIC_API_KEY: ${{ secrets.SPQ_ANTHROPIC_API_KEY }}
          SPQ_VLLM_API_KEY: ${{ secrets.SPQ_VLLM_API_KEY }}
          IMAGE_GEN_API_KEY: ${{ secrets.IMAGE_GEN_API_KEY }}
          IMAGE_GEN_BASE_URL: ${{ secrets.IMAGE_GEN_BASE_URL }}
          IMAGE_GEN_MODEL: ${{ secrets.IMAGE_GEN_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TASK_ARGS=""
          if [ -n "${{ inputs.tasks }}" ]; then
            for task_id in $(echo "${{ inputs.tasks }}" | tr ',' ' '); do
              TASK_ARGS="$TASK_ARGS -t $task_id"
            done
          fi

          spq run \
            -p ${{ inputs.provider }} \
            -m ${{ inputs.mode }} \
            $TASK_ARGS \
            -o results/report-${{ inputs.provider }}-${{ inputs.mode }}.json \
            -v

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ inputs.provider }}-${{ inputs.mode }}
          path: results/
          retention-days: 30
